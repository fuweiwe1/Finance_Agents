appId: com.financeagents.app
productName: Finance Agents
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - renderer/**
  - resources/**
  - package.json
asar: true
# 无原生模块：跳过 @electron/rebuild（否则它去 GitHub 下 Electron headers，国内被墙超时）
npmRebuild: false
win:
  target:
    - nsis
    - portable
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Finance Agents
  artifactName: ${productName}-${version}-Setup-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
publish:
  provider: github
  owner: fuweiwe1
  repo: Finance_Agents
  # 直接发布为公开 Release（默认 draft 草稿需手动 Publish；同 tag 多草稿会让上传拆散丢失）。设 releaseType: release 后 CI 跑完即可见可更新。
  releaseType: release